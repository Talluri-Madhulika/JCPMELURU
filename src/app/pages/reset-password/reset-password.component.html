<div class="forgot-page">

  <div class="forgot-card">

    <div class="forgot-icon">
      🔒
    </div>

    <h1>Reset Password</h1>

    <p>
      Enter your new password below.
    </p>

    <div class="input-group">
      <label>New Password</label>

      <div class="password-input-wrapper">
        <input
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Enter new password"
          [(ngModel)]="password"
        >
        <button type="button" class="eye-btn" (click)="togglePasswordVisibility()" aria-label="Toggle password visibility">
          {{ showPassword ? '👁️‍🗨️' : '👁️' }}
        </button>
      </div>
    </div>

    <p
      *ngIf="errorMessage"
      class="error-message"
      style="color: red; font-size: 12px; margin-bottom: 15px;"
    >
      {{ errorMessage }}
    </p>

    <button type="button" (click)="resetPassword()" [disabled]="loading">
      {{ loading ? 'Saving...' : 'Reset Password' }}
    </button>

    <p class="back-login">
      Remember your password?
      <a routerLink="/login">Sign In</a>
    </p>

  </div>

</div>
